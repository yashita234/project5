<head>
    <title>Multiplication using Function</title>
</head>

<body>
    <h1>Codingal Education</h1>
    <h3>Multiplication using Function and Parameters</h3>

    <p id="output"></p>

    <script>
    // function with parameters
    var multiply = function(a, b) {
        return a * b;
    };

    document.getElementById("output").innerHTML = multiply(6, 7);
    </script>

   
</body>

</html>
